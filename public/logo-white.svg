<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Elegant Card/Invitation Icon -->
  <g id="card-icon">
    <!-- Main Card -->
    <rect x="4" y="6" width="46" height="48" rx="5" fill="white" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <!-- Card Fold/Shadow -->
    <path d="M4 6 L50 6 L46 10 L4 10 Z" fill="rgba(0,0,0,0.15)" opacity="0.3"/>
    <!-- Decorative Lines -->
    <line x1="12" y1="20" x2="42" y2="20" stroke="url(#cardGradient)" stroke-width="1.8" stroke-opacity="0.9" stroke-linecap="round"/>
    <line x1="12" y1="26" x2="38" y2="26" stroke="url(#cardGradient)" stroke-width="1.5" stroke-opacity="0.7" stroke-linecap="round"/>
    <line x1="12" y1="32" x2="35" y2="32" stroke="url(#cardGradient)" stroke-width="1.5" stroke-opacity="0.7" stroke-linecap="round"/>
    <!-- Elegant heart ornament -->
    <path d="M27 38 C27 38, 24 40, 24 42 C24 44, 27 46, 27 46 C27 46, 30 44, 30 42 C30 40, 27 38, 27 38 Z" fill="url(#cardGradient)" opacity="0.95"/>
  </g>
  
  <!-- Modern Typography "My Card" -->
  <g id="text">
    <text x="58" y="28" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" letter-spacing="-0.5" fill="white">
      My
    </text>
    <text x="58" y="48" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" letter-spacing="-0.5" fill="white">
      Card
    </text>
  </g>
  
  <!-- Subtle tagline -->
  <text x="58" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="500" fill="rgba(255,255,255,0.75)" letter-spacing="0.5">
    INVITATION MANAGEMENT
  </text>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F97316;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FB923C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EA580C;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
