<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="card2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#ffffff"/>
  
  <!-- Card 1 (top, white) -->
  <g transform="translate(16, 8) rotate(-10)">
    <rect x="-6" y="-4" width="12" height="8" rx="1" fill="#f0f0f0" stroke="#d1d5db" stroke-width="0.3"/>
  </g>
  
  <!-- Card 2 (middle, blue/purple) -->
  <g transform="translate(14, 12) rotate(-5)">
    <rect x="-6" y="-4" width="12" height="8" rx="1" fill="url(#card2)"/>
  </g>
  
  <!-- Card 3 (bottom, pink/red) -->
  <g transform="translate(12, 16)">
    <rect x="-6" y="-4" width="12" height="8" rx="1" fill="url(#card3)"/>
  </g>
</svg>
